# .gitlab-ci.yml
# Generated by @zairakai/js-dev-tools

include:
  - project: "zairakai/npm-packages/js-dev-tools"
    ref: 3.0.0
    file: ".gitlab/ci/pipeline-js-package.yml"

variables:
  CACHE_KEY: "js-http-client-v1"
  NPM_PACKAGE_NAME: "@zairakai/js-http-client"

# The documentation site, published with GitLab Pages from main: main ("next") and every released version,
# each built from its own tag, with a version selector. See docs/scripts/publish.sh.
pages:
  stage: build
  image: ${NODE_IMAGE}
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
    - node --version
  script:
    - bash docs/scripts/publish.sh
  # The next jobs of the runner must not find (and lint) the docs dependencies.
  after_script:
    - rm -rf docs/node_modules docs/reference docs/guide/readme.md docs/.vitepress/dist docs/.vitepress/cache
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
